name: Security scan

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    - cron: "17 1 * * *" # 每日 09:17（Asia/Shanghai）
  workflow_dispatch:

permissions:
  contents: read

# 定时扫描单独一组且不取消，不会因 cancelled() 误触发 notify 开 issue；
# main 按 SHA 分组不取消（ci-checklist 3.17），其他分支取消旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, sha256 verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      - name: Scan
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  osv:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test vulnerability gates
        run: python3 scripts/check-vulns.py selftest

      - name: Check ignore list expiry
        run: python3 scripts/check-vulns.py ignores

      - name: Install osv-scanner (pinned, sha256 verified)
        run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan and gate (High/Critical fail, Medium warn)
        run: |
          # osv-scanner：0 无漏洞，1 有漏洞（交给 gate 判级），其他退出码判失败
          python3 scripts/check-vulns.py osv-config osv-ci.toml
          rc=0
          ./osv-scanner scan source --config osv-ci.toml -L pnpm-lock.yaml --format json > osv.json || rc=$?
          python3 scripts/check-vulns.py gate osv.json "$rc"

  audit:
    name: pnpm audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Self-test vulnerability gates
        run: python3 scripts/check-vulns.py selftest

      - name: Audit
        run: |
          # pnpm audit：0 无漏洞，1 有漏洞（交给 audit-gate 判级），其他退出码判失败；
          # JSON 带 error 键、缺 advisories/metadata 或不是合法 JSON 也判失败
          rc=0
          pnpm audit --json > audit.json || rc=$?
          python3 scripts/check-vulns.py audit-gate audit.json "$rc"

  notify:
    name: Report scheduled failure
    needs: [gitleaks, osv, audit]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update issue
        run: |
          title="每日安全扫描失败"
          label="security-scan"
          gh label create "$label" --color B60205 --description "每日安全扫描失败告警" --force
          num=$(gh issue list --state open --label "$label" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="每日安全扫描失败或被取消，请开源维护官查看：$RUN_URL"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
