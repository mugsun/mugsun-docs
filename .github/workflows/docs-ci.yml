name: Docs CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: Workflow permissions and pinned actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflows
        run: python3 scripts/check-workflows.py

  lint:
    name: Doc width and CHANGELOG (new lines only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve diff base
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # 基线（ci-checklist 3.17）：PR 用 PR 基准；main 用非全零的 before；
          # 其他分支 push（含首推 before 全 0）和 dispatch 用 merge-base origin/main HEAD；
          # main 上 dispatch 没有 before，用 HEAD~1。拿不到基线就报错失败。
          zero="0000000000000000000000000000000000000000"
          valid() { [ -n "$1" ] && [ "$1" != "$zero" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            valid "$PR_BASE" && base="$PR_BASE"
          elif [ "$REF" = "refs/heads/main" ]; then
            if [ "$EVENT" = "push" ]; then
              valid "$PUSH_BEFORE" && base="$PUSH_BEFORE"
            else
              base=$(git rev-parse --verify -q HEAD~1 || true)
            fi
          else
            base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then
            echo "::error::无法确定 diff 基线（$EVENT $REF）"
            exit 1
          fi
          echo "diff base: $base ($EVENT $REF)"
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"

      - name: Check Chinese paragraph width (<= 80)
        run: python3 scripts/check-doc-width.py "$DIFF_BASE"

      - name: Check CHANGELOG
        run: python3 scripts/check-changelog.py "$DIFF_BASE"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated needs git history

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (VitePress fails on internal dead links)
        run: pnpm run docs:build

      - name: Install lychee (pinned, sha256 verified)
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          f="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$f" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$f"
          echo "${LYCHEE_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

      - name: Check internal links (offline)
        run: >-
          ./lychee --offline --no-progress
          --root-dir "$GITHUB_WORKSPACE/.vitepress/dist"
          --fallback-extensions html
          --index-files index.html
          --exclude-path .vitepress/dist/demo
          --exclude-path .vitepress/dist/public
          '.vitepress/dist/**/*.html'
