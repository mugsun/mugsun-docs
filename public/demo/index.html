<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ms-ui H5 演示（占位）</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --card: #ffffff;
        --border: #e2e8f0;
        --accent: #c45c26;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --card: #111827;
          --border: #1f2937;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 320px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 18px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 650;
      }
      p {
        margin: 0 0 10px;
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--accent);
        word-break: break-all;
      }
      .route {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border: 1px dashed color-mix(in srgb, var(--accent) 35%, var(--border));
        font-size: 12px;
      }
      .route strong { color: var(--fg); font-weight: 600; }
      ol { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>H5 演示尚未接入</h1>
        <p>
          这里是文档站占位页。正式内容由
          <strong>HBuilderX</strong> 对
          <code>mugsun-uniappx-ui</code>
          做 Web/蒸汽模式导出后，覆盖到
          <code>docs/public/demo/</code>。
        </p>
        <div class="route">
          <div><strong>目标路由</strong></div>
          <code id="route">#/</code>
        </div>
        <ol>
          <li><code>cli launch web --project &lt;仓根&gt; --compile true</code></li>
          <li>把 <code>unpackage/dist/web</code>（以本机构建为准）拷到本目录</li>
          <li>文档 iframe 使用 <code>/demo/index.html#/pages/demo/…</code></li>
        </ol>
      </div>
    </main>
    <script>
      (function () {
        var el = document.getElementById('route')
        function sync() {
          var hash = location.hash || '#/'
          el.textContent = hash
        }
        sync()
        window.addEventListener('hashchange', sync)
      })()
    </script>
  </body>
</html>
